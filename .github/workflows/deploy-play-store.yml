name: Deploy to Play Store (Internal Testing)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable

      # Reconstructs the same signing identity that lives locally at
      # flutter/android/{key.properties,app/release.keystore} (both
      # gitignored) — this is that keystore, base64-encoded, plus its
      # credentials, so CI produces a build signed identically to a local
      # release build. See the local key.properties for the actual values.
      - name: Restore release keystore
        working-directory: flutter/android
        run: |
          echo "${{ secrets.PLAY_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          cat > key.properties <<EOF
          storePassword=${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.PLAY_KEY_PASSWORD }}
          keyAlias=${{ secrets.PLAY_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      # Play requires a strictly increasing versionCode per upload. Rather
      # than relying on pubspec.yaml being bumped by hand before every push
      # (the first automated run failed on exactly this), derive it from
      # this workflow's own run number, offset well clear of any versionCode
      # already uploaded manually (highest so far: 4) — guaranteed to keep
      # increasing on every run, forever, with no manual step. pubspec.yaml's
      # version *name* (the human-readable "0.4.0" part) is untouched and
      # still yours to bump for real milestones; only the numeric build
      # number is auto-derived.
      - name: Build release AAB
        working-directory: flutter
        run: flutter build appbundle --release --build-number=$((${{ github.run_number }} + 100))

      - name: Upload to Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.reelay.tv
          releaseFiles: flutter/build/app/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
