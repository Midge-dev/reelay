name: Deploy to Play Store (Internal Testing)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable

      # Reconstructs the same signing identity that lives locally at
      # flutter/android/{key.properties,app/release.keystore} (both
      # gitignored) — this is that keystore, base64-encoded, plus its
      # credentials, so CI produces a build signed identically to a local
      # release build. See the local key.properties for the actual values.
      - name: Restore release keystore
        working-directory: flutter/android
        run: |
          echo "${{ secrets.PLAY_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore
          cat > key.properties <<EOF
          storePassword=${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.PLAY_KEY_PASSWORD }}
          keyAlias=${{ secrets.PLAY_KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Build release AAB
        working-directory: flutter
        run: flutter build appbundle --release

      # Play requires a strictly increasing versionCode per upload — bump
      # pubspec.yaml's version (e.g. 0.4.0+4 -> 0.4.1+5) before pushing
      # whenever you want a new build to actually reach testers. Pushing
      # without bumping it will make this step fail with a clear "version
      # code already used" error rather than silently doing nothing.
      - name: Upload to Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.reelay.tv
          releaseFiles: flutter/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
