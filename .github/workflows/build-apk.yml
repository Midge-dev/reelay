name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable

      # Up to three tries: a runner sometimes fails to download Gradle or an
      # Android dependency (16a2d42's build died 47 s in, with nothing in
      # the commit touching Android, and built fine locally).
      - name: Build debug APK
        working-directory: flutter
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --debug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Build debug APK failed (attempt $attempt of 3), retrying in 30 s"
              sleep 30
            fi
          done
          echo "::error::Build debug APK failed 3 times"
          exit 1

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically built from the latest push to main. Download `app-debug.apk` below and sideload it.
          prerelease: false
          files: flutter/build/app/outputs/flutter-apk/app-debug.apk
